[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecd-propensity"
version = "0.1.0"
description = "Leakage-safe customer propensity research foundation"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb", "pyarrow", "huggingface-hub", "PyYAML", "psutil"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
