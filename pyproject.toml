[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propensity-enterprise"
version = "3.0.0"
description = "Enterprise Lambda Architecture for Household Purchase Propensity (On-Premise to Cloud)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "lightgbm>=4.7",          # eval_X / eval_y API
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "feast>=0.67.0",
    "scipy>=1.11.0",
    "prometheus_client>=0.20.0",
    "kafka-python-ng>=2.2.0",
]

[project.optional-dependencies]
# Evidently reports of feature store snapshots (batch / pipeline image only, not serving)
observability = [
    "evidently>=0.7.23,<0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27.0",
    "ruff>=0.4",
    "fakeredis>=2.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "requires_data: needs the real Dunnhumby CSVs under settings.DATA_RAW_DIR",
    "integration: needs live infrastructure (Redis / Kafka)",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/**/__init__.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".agent", "notebooks", "docs/analysis/archive_crisp_dm"]  # archive kept verbatim

[tool.ruff.lint]
# Pin the rule set so CI does not depend on a developer's global ruff config.
select = ["E4", "E7", "E9", "F"]
