[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propensity-vsf"
version = "2.0.0"
description = "Management-ready, point-in-time household purchase propensity with CRISP-DM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["ipython>=8.0", "pytest>=8.0", "ruff>=0.4"]

[project.scripts]
propensity-v2 = "propensity_v2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/propensity_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
