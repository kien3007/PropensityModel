global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Serving API: request/latency metrics plus model-quality gauges (drift, realized AUC,
  # batch view) refreshed from MonitoringState on every scrape.
  - job_name: "propensity-serving-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["serving-api:8000"]

  # Kafka consumer worker: consumer lag and applied/duplicate event counters.
  - job_name: "propensity-speed-consumer"
    static_configs:
      - targets: ["kafka-consumer:9101"]
