# ==============================================================================
# Propensity platform - on-premise batch scoring stack.
#
#   cp .env.example .env            # fill in the secrets (compose refuses to start without them)
#   docker compose up -d --build    # serving + scheduler + observability
#   docker compose --profile tools run --rm batch-pipeline     # one-off batch scoring
#   python -m scripts.e2e_smoke     # full end-to-end smoke test in an isolated project
#
# Shared state lives in named volumes: lakehouse_data (DuckDB + Bronze Parquet + Feast feature store),
# outputs_data (batch artefacts, monitoring reports) and models_data (champion registry,
# seeded from the image on first use, so containers never write into the git checkout).
# Raw Dunnhumby CSVs are mounted read-only from RAW_DATA_DIR.
# ==============================================================================

x-app-env: &app-env
  ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  STRICT_INFRA: ${STRICT_INFRA:-true}
  SERVING_API_KEYS: ${SERVING_API_KEYS:?set SERVING_API_KEYS in .env}
  DATA_RAW_DIR: /app/sample_data/dunnhumby
  LAKEHOUSE_PATH: /app/data/lakehouse/propensity_warehouse.duckdb
  OUTPUT_DIR: /app/data/outputs
  MODEL_PATH: /app/models/champion_model.joblib
  FEATURE_STORE_DIR: /app/data/lakehouse/feature_store

x-pipeline: &pipeline
  build:
    context: .
    dockerfile: docker/Dockerfile.pipeline
  image: propensity-pipeline:local
  environment:
    <<: *app-env
  volumes:
    - ${RAW_DATA_DIR:?set RAW_DATA_DIR in .env}:/app/sample_data/dunnhumby:ro
    - lakehouse_data:/app/data/lakehouse
    - outputs_data:/app/data/outputs
    - models_data:/app/models

services:
  # ---------------------------------------------------------------- core infrastructure
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- serving
  serving-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    image: propensity-serving:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "${SERVING_HOST_PORT:-8000}:8000"
    volumes:
      - models_data:/app/models
      - outputs_data:/app/data/outputs
    # Liveness is the image HEALTHCHECK (/health); readiness (/ready) waits for batch views.

  # ---------------------------------------------------------------- batch & orchestration
  batch-pipeline:
    <<: *pipeline
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools # docker compose --profile tools run --rm batch-pipeline [cmd]

  scheduler:
    <<: *pipeline
    restart: unless-stopped
    command: ["python", "-m", "src.scheduler.daemon", "--poll-interval", "30", "--serving-url", "http://serving-api:8000"]
    depends_on:
      serving-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    depends_on:
      alertmanager:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  lakehouse_data:
  outputs_data:
  models_data:
  prometheus_data:
  grafana_data:
