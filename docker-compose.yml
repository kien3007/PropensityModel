# ==============================================================================
# Propensity platform - on-premise Lambda stack.
#
#   cp .env.example .env            # fill in the secrets (compose refuses to start without them)
#   docker compose up -d --build    # serving + speed layer + scheduler + observability
#   docker compose --profile tools run --rm batch-pipeline     # one-off batch scoring
#   python -m scripts.e2e_smoke     # full end-to-end smoke test in an isolated project
#
# Shared state lives in named volumes: lakehouse_data (DuckDB + Bronze Parquet),
# outputs_data (batch artefacts, monitoring reports) and models_data (champion registry,
# seeded from the image on first use, so containers never write into the git checkout).
# Raw Dunnhumby CSVs are mounted read-only from RAW_DATA_DIR.
# Postgres / MinIO are not used by the application code; they are kept behind the
# optional "storage" profile.
# ==============================================================================

x-app-env: &app-env
  ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_ENABLED: "true"
  STRICT_INFRA: ${STRICT_INFRA:-true}
  SERVING_API_KEYS: ${SERVING_API_KEYS:?set SERVING_API_KEYS in .env}
  DATA_RAW_DIR: /app/sample_data/dunnhumby
  LAKEHOUSE_PATH: /app/data/lakehouse/propensity_warehouse.duckdb
  OUTPUT_DIR: /app/data/outputs
  MODEL_PATH: /app/models/champion_model.joblib

x-pipeline: &pipeline
  build:
    context: .
    dockerfile: docker/Dockerfile.pipeline
  image: propensity-pipeline:local
  environment:
    <<: *app-env
  volumes:
    - ${RAW_DATA_DIR:?set RAW_DATA_DIR in .env}:/app/sample_data/dunnhumby:ro
    - lakehouse_data:/app/data/lakehouse
    - outputs_data:/app/data/outputs
    - models_data:/app/models

services:
  # ---------------------------------------------------------------- core infrastructure
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------- serving & speed layer
  serving-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    image: propensity-serving:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "${SERVING_HOST_PORT:-8000}:8000"
    volumes:
      - models_data:/app/models
      - outputs_data:/app/data/outputs
    # Liveness is the image HEALTHCHECK (/health); readiness (/ready) waits for batch views.

  kafka-consumer:
    <<: *pipeline
    restart: unless-stopped
    command: ["python", "-m", "src.speed_layer.kafka_bus", "--mode", "consumer"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *app-env
      CONSUMER_METRICS_PORT: "9101"
    expose:
      - "9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------- batch & orchestration
  batch-pipeline:
    <<: *pipeline
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools # docker compose --profile tools run --rm batch-pipeline [cmd]

  scheduler:
    <<: *pipeline
    restart: unless-stopped
    command: ["python", "-m", "src.scheduler.daemon", "--poll-interval", "30", "--serving-url", "http://serving-api:8000"]
    depends_on:
      serving-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    depends_on:
      alertmanager:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- optional storage profile
  # Not used by the application code today. MinIO's community images are no longer
  # published on Docker Hub; set MINIO_IMAGE to an image you have access to.
  postgres:
    image: postgres:16-alpine
    profiles: ["storage"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propensity_oltp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-03-30T09-41-56Z}
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  kafka_data:
  lakehouse_data:
  outputs_data:
  models_data:
  prometheus_data:
  grafana_data:
  postgres_data:
  minio_data:
