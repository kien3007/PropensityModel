version: "3.8"

services:
  # ============================================================================
  # 1. OLTP Database (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: propensity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: propensity_oltp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propensity_oltp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Master Dataset Object Store (MinIO S3 Compatible)
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: propensity_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bucket Initializer for MinIO
  minio-init:
    image: minio/mc:latest
    container_name: propensity_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse-master;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse-bronze;
      /usr/bin/mc mb --ignore-existing myminio/mlflow-artifacts;
      exit 0;
      "

  # ============================================================================
  # 3. Speed & Serving Layer Cache (Redis 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: propensity_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 4. Serving Layer: FastAPI Unified Fusion Gateway
  # ============================================================================
  serving-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    container_name: propensity_serving_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=propensity_oltp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pwd
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - LAKEHOUSE_PATH=/app/data/lakehouse/propensity_warehouse.duckdb
      - MODEL_PATH=/app/models/champion_model.joblib
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Required in production: admin/write endpoints fail closed (503) without keys.
      - SERVING_API_KEYS=${SERVING_API_KEYS:-}
      - STRICT_INFRA=${STRICT_INFRA:-false}
    ports:
      - "8000:8000"
    volumes:
      - lakehouse_data:/app/data/lakehouse

  # ============================================================================
  # 5. Batch Layer: Weekly Batch Scoring & Pipeline Runner (On-Demand)
  # ============================================================================
  batch-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: propensity_batch_pipeline
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - LAKEHOUSE_PATH=/app/data/lakehouse/propensity_warehouse.duckdb
      - MODEL_PATH=/app/models/champion_model.joblib
    volumes:
      - lakehouse_data:/app/data/lakehouse
    profiles:
      - tools # Only runs on demand: docker compose --profile tools run batch-pipeline

  # ============================================================================
  # 6. Automated Scheduler: Cron Daemon for Weekly Batch & Monthly Retraining
  # ============================================================================
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: propensity_scheduler
    restart: unless-stopped
    command: ["python", "-m", "src.scheduler.daemon", "--poll-interval", "30", "--serving-url", "http://serving-api:8000"]
    depends_on:
      - serving-api
      - postgres
      - minio
      - redis
    environment:
      - ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=propensity_oltp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pwd
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - LAKEHOUSE_PATH=/app/data/lakehouse/propensity_warehouse.duckdb
      - MODEL_PATH=/app/models/champion_model.joblib
      - SERVING_API_KEYS=${SERVING_API_KEYS:-}
    volumes:
      - lakehouse_data:/app/data/lakehouse
      - ./models:/app/models
      - ./output:/app/output

  # ============================================================================
  # 7. Observability: Prometheus Metrics Collector
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: propensity_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  # ============================================================================
  # 8. Observability Dashboard: Grafana (Port 3000)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: propensity_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ============================================================================
  # 9. Streaming Message Bus (Apache Kafka KRaft Mode - Zero Zookeeper)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: propensity_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ============================================================================
  # 10. Kafka Stream Worker: Background Event Consumer to Redis
  # ============================================================================
  kafka-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    container_name: propensity_kafka_consumer
    restart: unless-stopped
    command: ["python", "-m", "src.speed_layer.kafka_bus", "--mode", "consumer"]
    depends_on:
      - kafka
      - redis
    environment:
      - ENV=production
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  postgres_data:
  minio_data:
  redis_data:
  lakehouse_data:
  prometheus_data:
  grafana_data:
  kafka_data:
