name: E2E (docker compose)

# Full-stack smoke test: builds the images, starts the compose stack, runs batch scoring,
# training, feedback, a Kafka speed event and the observability checks
# (scripts/e2e_smoke.py). Uses synthetic Dunnhumby-shaped data, so no real data is needed.
on:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (host side of the smoke test)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[observability]"

      - name: Compose stack smoke test
        run: python -m scripts.e2e_smoke --data synthetic
